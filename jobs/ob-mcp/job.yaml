# ghostlab job 'ob-mcp' — one self-contained MCP evaluation.
# Everything about this job lives in this folder: job.yaml (this file),
# test-plan.yaml, workspace/ (artifacts + db), and runs/.
#
# Edit any setting below; `ghostlab discover` only rewrites `capabilities`.
# `generation`/`test` values are the defaults each command uses (an explicit
# CLI flag still wins). Leave a `prompts:` entry blank to use the built-in;
# set it to your own template to override. Available {placeholders}:
#   aut: target_id, transport, capabilities, mcp_config_path, scenario_id, scenario_title, goal, transcript, user_message
#   user_emulator: persona, goal, widget_section, transcript, last_assistant_message
#   judge: goal, criteria_block, signals_block, tools_line, tool_calls, transcript
#   critique: goal, tools, transcript
#   persona_gen: mcp, domain_summary, categories, n
#   scenario_gen: profile_digest, persona_section, n, persona_field_help
#   profile: digest, families
schema_version: 1
id: ob-mcp
name: ob-mcp
workspace: workspace
target:
  transport: stdio
  connection:
    url: obsidian.json
    headers: {}
  capabilities: {}
  startup:
    timeout_seconds: 30
setup:
  commands: []
  health: []
  reset: []
  teardown: []
  fixtures: []
hosts:
  - id: direct-mcp
    kind: direct-mcp
    roles:
      - contract
      - deterministic
capabilities: {}
generation:
  personas: 2
  scenarios_per_persona: 2
  model: ""
  codex_bin: ""
  regenerate: false
test:
  suites: []
  judge: true
  apps_mode: false
  repeat: 1
  timeout: 30.0
  user_runner: ""
  approved_only: false
prompts:
  aut: ""
  user_emulator: ""
  judge: ""
  critique: ""
  persona_gen: ""
  scenario_gen: ""
  profile: ""
test_plan: {}
review:
  gates:
    min_pass_rate: 0.2
    no_tool_schema_errors: true
    no_ui_console_errors: true
    no_high_security_findings: true
