name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distribution
        run: python -m build

      - name: Verify distribution name
        run: python -c "import email, pathlib, zipfile; wheel = next(pathlib.Path('dist').glob('*.whl')); metadata_name = next(name for name in zipfile.ZipFile(wheel).namelist() if name.endswith('METADATA')); metadata = email.message_from_bytes(zipfile.ZipFile(wheel).read(metadata_name)); assert metadata['Name'] == 'ghostlab', metadata['Name']; print(f\"Publishing {metadata['Name']} {metadata['Version']}\")"

      - name: Check distribution
        run: python -m twine check dist/*

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
