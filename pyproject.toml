[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ghostlab"
dynamic = ["version"]
description = "A headless runner for coding agents (Claude Code, Codex, Copilot, OpenCode), sandboxed in NVIDIA OpenShell, with a Python SDK for checkpointed, resumable agent pipelines: evals, labeling, and batch jobs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "SajjadGG" }
]
keywords = [
  "agents",
  "ai-agents",
  "headless",
  "pipeline",
  "batch",
  "evaluation",
  "llm-evaluation",
  "labeling",
  "mcp",
  "codex",
  "claude-code",
  "github-copilot",
  "opencode",
  "openshell",
  "sandbox",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mkdocs>=1.6",
  "pytest>=8.0",
  "twine>=5.0",
]
docs = [
  "mkdocs>=1.6",
]

[project.scripts]
ghostlab = "ghostlab.cli:main"

[project.urls]
Documentation = "https://sajjadgg.github.io/Ghostlab/"
Homepage = "https://github.com/sajjadGG/Ghostlab"
Repository = "https://github.com/sajjadGG/Ghostlab"
Issues = "https://github.com/sajjadGG/Ghostlab/issues"
Changelog = "https://github.com/sajjadGG/Ghostlab/releases"

[tool.hatch.version]
path = "ghostlab/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["ghostlab"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/LICENSE",
  "/CONTRIBUTING.md",
  "/llms.txt",
  "/docs",
  "/mkdocs.yml",
  "/pyproject.toml",
  "/ghostlab",
  "/tests",
  "/examples",
  "/docker",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
