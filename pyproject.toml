[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ghostlab"
dynamic = ["version"]
description = "Local end-to-end testing lab for any MCP server: coding agents role-play real users, drive your tools over multiple turns, score runs, and render/interact with MCP Apps ui:// widgets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "SajadGG" }
]
keywords = [
  "mcp",
  "model-context-protocol",
  "testing",
  "end-to-end-testing",
  "cli",
  "agents",
  "ai-agents",
  "llm",
  "llm-evaluation",
  "evaluation",
  "codex",
  "claude",
  "mcp-apps",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mkdocs>=1.6",
  "pytest>=8.0",
  "twine>=5.0",
]
docs = [
  "mkdocs>=1.6",
]
ui = [
  "streamlit>=1.30",
]
apps = [
  "playwright>=1.40",
]

[project.scripts]
ghostlab = "rehearsal.cli:main"
rehearsal = "rehearsal.cli:main"

[project.urls]
Documentation = "https://sajjadgg.github.io/Ghostlab/"
Homepage = "https://github.com/sajjadGG/Ghostlab"
Repository = "https://github.com/sajjadGG/Ghostlab"
Issues = "https://github.com/sajjadGG/Ghostlab/issues"
Changelog = "https://github.com/sajjadGG/Ghostlab/releases"

[tool.hatch.version]
path = "rehearsal/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["rehearsal", "ghostlab"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/LICENSE",
  "/CONTRIBUTING.md",
  "/llms.txt",
  "/docs",
  "/mkdocs.yml",
  "/pyproject.toml",
  "/rehearsal",
  "/ghostlab",
  "/tests",
  "/examples",
  "/runners",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
